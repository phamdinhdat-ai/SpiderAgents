version: '3.8'

volumes:
  openspider-data:
    name: openspider-data
  openspider-secrets:
    name: openspider-secrets
  openspider-backups:
    name: openspider-backups

services:
  openspider:
    image: agentscope/openspider:latest
    container_name: openspider
    restart: always
    ports:
      - "127.0.0.1:8088:8088"
    # environment:
    #   - openspider_AUTH_ENABLED=true
    #   - openspider_AUTH_USERNAME=admin
    #   - openspider_AUTH_PASSWORD=yourpassword
    volumes:
      - openspider-data:/app/working
      - openspider-secrets:/app/working.secret
      - openspider-backups:/app/working.backups
